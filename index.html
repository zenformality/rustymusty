<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rustymusty</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <main>
    <div class="center">
      <h1 class="title">♨️ rustymusty</h1>
      <p class="tagline">search the web</p>

      <form id="search-form" class="search-box">
        <input type="text" id="query" placeholder="type something..." autofocus>
        <div class="btn-row">
          <button type="submit" data-engine="google">google</button>
          <button type="submit" data-engine="duckduckgo">duckduckgo</button>
        </div>
      </form>

      <div id="history" class="history"></div>
    </div>
  </main>

  <footer>
    built by zenx · powered by google & duckduckgo
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
